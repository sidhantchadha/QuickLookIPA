name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        # Use latest available Xcode
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

    - name: Show build environment
      run: |
        echo "### Build Environment" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode:** $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Swift:** $(swift --version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- **macOS:** $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY

        xcodebuild -version
        swift --version
        sw_vers

    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.xcodeproj') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-

    - name: Build QuickLookIPA (Debug)
      run: |
        xcodebuild clean build \
          -project QuickLookIPA.xcodeproj \
          -scheme QuickLookIPA \
          -configuration Debug \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty || true

    - name: Build QuickLookIPA (Release)
      run: |
        xcodebuild clean build \
          -project QuickLookIPA.xcodeproj \
          -scheme QuickLookIPA \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty || true

    - name: Verify app bundle
      run: |
        APP_PATH=$(find ./build -name "QuickLookIPA.app" -type d | head -1)

        if [ -z "$APP_PATH" ]; then
          echo "❌ Error: QuickLookIPA.app not found!"
          exit 1
        fi

        echo "✅ App bundle found at: $APP_PATH"

        # Check Info.plist exists
        if [ -f "$APP_PATH/Contents/Info.plist" ]; then
          echo "✅ Info.plist exists"

          # Extract version info
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "unknown")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "unknown")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "unknown")

          echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle ID:** $BUNDLE_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **App Path:** \`$APP_PATH\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Warning: Info.plist not found"
        fi

        # Check binary exists
        if [ -f "$APP_PATH/Contents/MacOS/QuickLookIPA" ]; then
          echo "✅ Binary exists"

          # Get binary info
          file "$APP_PATH/Contents/MacOS/QuickLookIPA"

          # Get file size
          SIZE=$(du -h "$APP_PATH" | tail -1 | cut -f1)
          echo "- **App Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Error: Binary not found!"
          exit 1
        fi

    - name: SwiftLint
      if: always()
      continue-on-error: true
      run: |
        # Install SwiftLint if not available
        if ! command -v swiftlint &> /dev/null; then
          echo "Installing SwiftLint..."
          brew install swiftlint
        fi

        # Run SwiftLint
        swiftlint lint --reporter github-actions-logging || true

    - name: Build Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
